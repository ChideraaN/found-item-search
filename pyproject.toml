[project]
name = "found-item-search"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.128.8",
    "psycopg[binary]>=3.2.13",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
]

[project.scripts]
found-item-search = "found_item_search:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
